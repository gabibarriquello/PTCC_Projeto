<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncluiGame - Sala de Jogos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-jogos">
        <a href="aluno_dashboard.html" style="position: absolute; left: 30px; color: var(--roxo-escuro); font-size: 1.5rem;"><i class="fa fa-arrow-left"></i></a>
        <h2>Sala de Jogos</h2>
        <p>Escolha um desafio e divirta-se enquanto aprende!</p>
    </header>

    <main class="jogos-container">
        
        <div class="jogo-card">
            <div class="jogo-banner"><i class="fa fa-calculator"></i></div>
            <div class="jogo-info">
                <h3>Mestre das Frações</h3>
                <p>Ajude o robô a dividir as pizzas corretamente!</p>
                <a href="Aulas.html?tipo=jogo" class="btn-jogar">Jogar Agora</a>
            </div>
        </div>

        <div class="jogo-card">
            <div class="jogo-banner" style="background: linear-gradient(135deg, #16a394, #0891b2);"><i class="fa fa-language"></i></div>
            <div class="jogo-info">
                <h3>Aventura Gramatical</h3>
                <p>Capture os verbos que estão fugindo da frase.</p>
                <a href="#" class="btn-jogar">Jogar Agora</a>
            </div>
        </div>

        <div class="jogo-card">
            <div class="jogo-banner" style="background: linear-gradient(135deg, #f59e0b, #d97706);"><i class="fa fa-globe-americas"></i></div>
            <div class="jogo-info">
                <h3>Eco-Herói</h3>
                <p>Separe o lixo e salve o planeta da poluição.</p>
                <a href="#" class="btn-jogar">Jogar Agora</a>
            </div>
        </div>

    </main>

    <div class="accessibility-bar">
        <button class="acc-btn libras" title="Libras"><i class="fa fa-hands-helping"></i></button>
        <button class="acc-btn text-size" title="Tamanho da Fonte"><i class="fa fa-font"></i></button>
        <button class="acc-btn audio" title="Ouvir texto"><i class="fa fa-volume-up"></i></button>
        <button class="acc-btn contrast" title="Alto contraste"><i class="fa fa-adjust"></i></button>
    </div>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

</body>
</html>

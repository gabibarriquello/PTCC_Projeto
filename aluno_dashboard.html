<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Dashboard do Aluno</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
   <header>
    <h1>IncluirGame</h1>
    <p>Olá, Aluno! O que vamos aprender hoje?</p>
   </header>

   <main class="dashboard-grid">
    <a href="jogos.html" class="card jogos">
     <i class="fa fa-gamepad"></i>
     <span>Jogos</span>
    </a>

    <a href="atividade.html" class="card atividades">
        <i class="fa fa-pencil-alt"></i>
        <span>Atividades</span>
    </a>

    <a href="conquistas.html" class="card conquistas">
        <i class="fa fa-trophy"></i>
        <span>Conquistas</span>
    </a>

    <a href="meu_perfil.html" class="card perfil">
        <i class="fa fa-user-circle"></i>
        <span>Meu Perfil</span>
    </a>
   </main>

   <div class="footer-acc">
       <button class="acc-btn text-size">AA</button>
       <button class="acc-btn contrast"><i class="fa fa-adjust"></i></button>
       <button class="acc-btn audio"><i class="fa fa-volume-up"></i></button>
       <button class="acc-btn libras"><i class="fa fa-hands-helping"></i></button>
   </div>
  <!--parte de acessbilidade-->
    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>

   <script src="js/login.js"></script>
 <!--Avatar das libras-->
<div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
    </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
</script> 

</body>
</html>

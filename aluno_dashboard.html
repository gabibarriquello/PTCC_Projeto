<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <title>Dashboard do Aluno</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h2>🎮</h2>

            <nav>

                <!-- HOME -->
                <a href="aluno_dashboard.html">
                    <i class="fa-solid fa-house"></i>
                </a>

                <!-- QUIZ / ATIVIDADES -->
                <a href="atividade.html">
                    <i class="fa-solid fa-book"></i>
                </a>

                <!-- RELATÓRIOS -->
                <a href="relatorios.html">
                    <i class="fa-solid fa-trophy"></i>
                </a>

                <!-- PERFIL -->
                <a href="perfil.html">
                    <i class="fa-solid fa-user"></i>
                </a>

            </nav>

        </aside>

        <!-- CONTEÚDO -->
        <main class="content">

            <!-- TOPO -->
            <header class="topo">

                <h2 id="saudacao"></h2>

                <img src="https://i.pravatar.cc/40" class="avatar">

            </header>

            <!-- CARDS -->
            <section class="cards">

                <div class="card-info">
                    ⭐ Nível <span id="nivel"></span>
                </div>

                <div class="card-info">
                    🪙 Moedas <span id="moedas"></span>
                </div>

                <div class="card-info">
                    💚 XP <span id="xp"></span>
                </div>

            </section>

            <!-- ATIVIDADES -->
            <section>

                <h3>Atividades para você</h3>

                <div class="atividades">

                    <div class="atividade-card">

                        <p>Matemática Divertida</p>

                        <button onclick="ganharPontos(10)">
                            Iniciar
                        </button>

                    </div>

                    <div class="atividade-card">

                        <p>Português em Aventura</p>

                        <button onclick="ganharPontos(20)">
                            Iniciar
                        </button>

                    </div>

                    <div class="atividade-card">

                        <p>Ciências em Missão</p>

                        <button onclick="ganharPontos(30)">
                            Iniciar
                        </button>

                    </div>

                </div>

            </section>

            <!-- PROGRESSO -->
            <section>

                <h3>Seu Progresso</h3>

                <div class="barra">
                    <div id="barraProgresso"></div>
                </div>

            </section>

        </main>

    </div>

    <!-- JS -->
    <script type="module" src="js/script.js"></script>

</body>

</html>

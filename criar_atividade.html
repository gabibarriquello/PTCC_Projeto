<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluiGame - Criar Atividade</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="layout-professor">
  <aside class="sidebar-professor">
    <nav>
      <a href="criar_atividade.html"><i class="fa-solid fa-house"></i>Início</a>
      <a href="turmas.html"><i class="fa-solid fa-users"></i>Alunos</a>
      <a href="criar_atividade.html" class="active"><i class="fa-solid fa-book"></i>Atividades</a>
      <a href="relatorios.html"><i class="fa-solid fa-chart-line"></i>Relatórios</a>
    </nav>
  </aside>

  <main class="conteudo-professor">
    
    <section class="container-criar">
      <header class="header-form">
        <a href="#" class="btn-voltar-circulo">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="header-text">
          <h2>Criar Atividade</h2>
          <p>Crie novas atividades para seus alunos.</p>
        </div>
      </header>

      <form>
        <div class="form-grid">
          <div class="field">
            <label>Título da atividade</label>
            <input type="text" placeholder="Ex: Jogo das Frações">
          </div>
          <div class="field">
            <label>Disciplina</label>
            <select>
              <option>Matemática</option>
              <option>Português</option>
              <option>Ciências</option>
              <option>Historia</option>
              <option>Geografia</option>
            </select>
          </div>
        </div>

        <div class="selection-group">
          <label>Tipo de atividade</label>
          <div class="chips-container">
            <div class="chip active"><i class="fa-solid fa-gamepad"></i> Jogo</div>
            <div class="chip"><i class="fa-solid fa-circle-question"></i> Quiz</div>
            <div class="chip"><i class="fa-solid fa-video"></i> Vídeo</div>
            <div class="chip"><i class="fa-solid fa-trophy"></i> Desafio</div>
          </div>
        </div>

        <div class="selection-group">
          <label>Nível de dificuldade</label>
          <div class="chips-container">
            <div class="chip"><i class="fa-solid fa-dumbbell"></i> Fácil</div>
            <div class="chip"><i class="fa-solid fa-bolt"></i> Médio</div>
            <div class="chip"><i class="fa-solid fa-fire"></i> Difícil</div>
          </div>
        </div>

        <div class="field">
          <label>Descrição</label>
          <textarea rows="4" placeholder="Descreva o objetivo da atividade..."></textarea>
        </div>

        <div class="footer-actions">
          <button type="button" class="btn btn-cancelar">Cancelar</button>
          <button type="submit" class="btn btn-salvar">Salvar</button>
        </div>
      </form>
    </section>

  </main>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Professor</title>

  <!-- Ícones -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout-professor">

  <!-- SIDEBAR -->
  <aside class="sidebar-professor">

    <h2>📘</h2>

    <nav>
      <a href="#"><i class="fa-solid fa-house"></i></a>
      <a href="#"><i class="fa-solid fa-users"></i></a>
      <a href="#"><i class="fa-solid fa-book"></i></a>
      <a href="#"><i class="fa-solid fa-chart-line"></i></a>
      <a href="#"><i class="fa-solid fa-right-from-bracket"></i></a>
    </nav>

  </aside>

  <!-- CONTEÚDO -->
  <main class="conteudo-professor">

    <!-- TOPO -->
    <header class="topo-professor">
      <div>
        <h1>Olá, Professor! 👋</h1>
        <p>Acompanhe o desempenho dos seus alunos.</p>
      </div>

      <img src="https://i.pravatar.cc/70" class="avatar-professor">
    </header>

    <!-- CARDS -->
    <section class="cards-professor">

      <div class="card-professor">
        <h3>Total de Alunos</h3>
        <h1>28</h1>
      </div>

      <div class="card-professor">
        <h3>Atividades Criadas</h3>
        <h1>15</h1>
      </div>

      <div class="card-professor">
        <h3>Turmas</h3>
        <h1>4</h1>
      </div>

      <div class="card-professor">
        <h3>Média da Turma</h3>
        <h1>8,2 ⭐</h1>
      </div>

    </section>

    <!-- GRÁFICO -->
    <section class="grafico-section">

      <div class="grafico-card">

        <h3>Desempenho da Turma</h3>

        <div class="grafico">

          <div class="linha"></div>

          <div class="ponto p1"></div>
          <div class="ponto p2"></div>
          <div class="ponto p3"></div>
          <div class="ponto p4"></div>

        </div>

      </div>

      <!-- ATIVIDADES -->
      <div class="atividade-recente">

        <h3>Atividades Recentes</h3>

        <div class="atividade-item">
          📘 Matemática Divertida
        </div>

        <div class="atividade-item">
          🌎 Português em Aventura
        </div>

        <div class="atividade-item">
          🚀 Ciências em Missão
        </div>

        <button>Ver todas</button>

      </div>

    </section>

  </main>

</div>

</body>
</html>

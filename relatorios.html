<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IncluiGame - Relatórios</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout-professor">
  <aside class="sidebar-professor">
    <nav>
      <a href="relatorios.html"><i class="fa-solid fa-house"></i>Início</a>
      <a href="turmas.html"><i class="fa-solid fa-users"></i>Alunos</a>
      <a href="criar_atividade.html"><i class="fa-solid fa-book"></i>Atividades</a>
      <a href="relatorios.html" class="active"><i class="fa-solid fa-chart-line"></i>Relatórios</a>
    </nav>
  </aside>

  <main class="conteudo-professor">
    <section class="container-relatorio">
      
      <header class="header-relatorio">
        <a href="#" class="btn-voltar-circulo"><i class="fa-solid fa-arrow-left"></i></a>
        <div>
          <h2 style="font-size: 22px;">Relatórios</h2>
          <p style="color: var(--cinza-texto); font-size: 13px;">Acompanhe o desempenho dos alunos.</p>
        </div>
      </header>

      <div class="selecao-aluno">
        <label style="font-weight: 600; font-size: 14px;">Selecione o aluno:</label>
        <select>
          <option>Ana Vitória</option>
          <option>Bruno Garcia</option>
          <option>Carla Souza</option>
        </select>
      </div>

      <div class="grid-metricas">
        <div class="card-metrica">
          <p>Média Geral</p>
          <h4>8,7</h4>
          <i class="fa-solid fa-chart-line" style="color: #22c55e;"></i>
        </div>
        <div class="card-metrica">
          <p>Atividades Concluídas</p>
          <h4>18/22</h4>
          <i class="fa-regular fa-circle-check" style="color: #16a394;"></i>
        </div>
        <div class="card-metrica">
          <p>Sequência</p>
          <h4>5 dias</h4>
          <i class="fa-solid fa-fire" style="color: #f59e0b;"></i>
        </div>
        <div class="card-metrica">
          <p>Moedas</p>
          <h4>250</h4>
          <i class="fa-solid fa-coins" style="color: #eab308;"></i>
        </div>
      </div>

      <div class="sessao-detalhes">
        <h3>Desempenho por Atividade</h3>

        <div class="item-progresso">
          <div class="info-progresso"><span>Matemática Divertida</span> <span>90%</span></div>
          <div class="barra-externa"><div class="barra-interna bg-verde" style="width: 90%;"></div></div>
        </div>

        <div class="item-progresso">
          <div class="info-progresso"><span>Português em Aventura</span> <span>75%</span></div>
          <div class="barra-externa"><div class="barra-interna bg-verde" style="width: 75%;"></div></div>
        </div>

        <div class="item-progresso">
          <div class="info-progresso"><span>Mundo Sustentável</span> <span>60%</span></div>
          <div class="barra-externa"><div class="barra-interna bg-amarelo" style="width: 60%;"></div></div>
        </div>

        <div class="item-progresso">
          <div class="info-progresso"><span>Ciências em Missão</span> <span>85%</span></div>
          <div class="barra-externa"><div class="barra-interna bg-verde" style="width: 85%;"></div></div>
        </div>
      </div>

    </section>
  </main>
</div>

</body>
</html>
